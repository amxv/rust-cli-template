name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Vercel affected-path logic
        run: bun run test:vercel

      - name: Check
        run: bun run check

      - name: Build static output for project-scoped Vercel deployment
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/rust-cli-template'
        run: |
          set -euo pipefail
          bun run build
          node scripts/prepare-prebuilt.mjs

      # Only docs/** pushes reach this workflow. Vercel Git auto-deploys are
      # disabled so a Rust/Swift-only push consumes no deployment quota.
      - name: Deploy production docs to Vercel
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/rust-cli-template'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Run just vercel-provision after linking docs/ to Vercel to configure the token secret and project variables.' >&2
            exit 1
          fi
          # Project-scoped tokens can fail broad CLI project-settings queries.
          # The Build Output API bundle avoids 'vercel pull/build' entirely.
          npx --yes vercel@latest deploy --prebuilt --prod --yes --non-interactive
